  <!-- slogans -->
  <text x="64" y="214" font-family="'Helvetica Neue', Helvetica, 'Proxima Nova', Arial, sans-serif" font-size="27" font-weight="600" fill="#94a3b8" textLength="590" lengthAdjust="spacingAndGlyphs">One Markdown file per book — into Obsidian.</text>
  <text x="64" y="252" font-family="'Helvetica Neue', Helvetica, 'Proxima Nova', Arial, sans-serif" font-size="20" fill="#64748b">Set it once, forget it: exports + upload every time you ask</text>

  <!-- settings card -->
  <rect x="700" y="58" width="436" height="244" rx="16" fill="#0a101f" fill-opacity="0.85" stroke="#23314e" stroke-width="1.5"/>
  <circle cx="724" cy="84" r="5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="742" cy="84" r="5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="760" cy="84" r="5" fill="#22c55e" fill-opacity="0.85"/>
  <text x="782" y="89" font-family="'iA Writer Mono S', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#64748b">tomedown · best settings</text>
  <line x1="700" y1="106" x2="1136" y2="106" stroke="#1b2740" stroke-width="1.5"/>

  <g font-family="'iA Writer Mono S', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16">
    <text x="724" y="142" fill="#64748b">upload</text>
    <text x="856" y="142" fill="#34d399">true</text>

    <text x="724" y="174" fill="#64748b">index</text>
    <text x="856" y="174" fill="#c4b5fd">obsidian-ready</text>

    <text x="724" y="206" fill="#64748b">local</text>
    <text x="856" y="206" fill="#e2e8f0">clipboard/tomedown</text>

    <text x="724" y="238" fill="#64748b">cloud</text>
    <text x="856" y="238" fill="#e2e8f0">webdav</text>

    <text x="724" y="270" fill="#64748b">markdown</text>
    <text x="856" y="270" fill="#e2e8f0">elegant frontmatter</text>
  </g>

  <!-- feature chips -->
  <g font-family="'Helvetica Neue', Helvetica, 'Proxima Nova', Arial, sans-serif" font-size="16" fill="#cbd5e1">
    <rect x="64" y="330" width="187" height="40" rx="20" fill="#0e1830" stroke="#26344f"/>
    <text x="157.5" y="355" text-anchor="middle" textLength="155" lengthAdjust="spacingAndGlyphs">Highlights + notes</text>
    <rect x="263" y="330" width="170" height="40" rx="20" fill="#0e1830" stroke="#26344f"/>
    <text x="348.0" y="355" text-anchor="middle" textLength="138" lengthAdjust="spacingAndGlyphs">YAML frontmatter</text>
    <rect x="445" y="330" width="168" height="40" rx="20" fill="#0e1830" stroke="#26344f"/>
    <text x="529.0" y="355" text-anchor="middle" textLength="136" lengthAdjust="spacingAndGlyphs">Obsidian-friendly</text>
    <rect x="625" y="330" width="222" height="40" rx="20" fill="#0e1830" stroke="#26344f"/>
    <text x="736.0" y="355" text-anchor="middle" textLength="190" lengthAdjust="spacingAndGlyphs">WebDAV → Remotely Save</text>
    <rect x="859" y="330" width="112" height="40" rx="20" fill="#0e1830" stroke="#26344f"/>
    <text x="915.0" y="355" text-anchor="middle" textLength="80" lengthAdjust="spacingAndGlyphs">Auto retry</text>
  </g>
</svg>
