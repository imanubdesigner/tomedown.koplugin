<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1160" viewBox="0 0 1200 800" role="img" aria-label="Tomedown quickstart tutorial 04 — Read it in Obsidian: install Remotely Save, configure WebDAV, set the abort guard to 100, sync and open the index">
  <style>
    .display { font-family: Georgia, "Times New Roman", serif; font-weight: 700; fill: #17150F; }
    .deck    { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #3A362C; }
    .label   { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.8px; fill: #17150F; }
    .labelm  { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.2px; fill: #6B6455; }
    .body    { font-family: Georgia, "Times New Roman", serif; fill: #2B271F; }
    .menu    { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; fill: #17150F; }
    .code    { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #17150F; }
    .rule    { stroke: #D7D0C4; stroke-width: 1; }
    .hair    { stroke: #D7D0C4; stroke-width: 1; opacity: 1; }
    .card    { fill: #FFFDF7; stroke: #D7D0C4; stroke-width: 1.5; }
    .skel    { fill: #D9D2C2; }
    .accent  { fill: #F5DE7E; }
  </style>

  <!-- paper -->
  <rect width="1200" height="800" fill="#F3EDE1"/>

  <!-- header -->
  <text class="label" x="64" y="56" font-size="13">TOMEDOWN — QUICKSTART</text>
  <rect x="952" y="40" width="184" height="24" rx="12" fill="#91A3B0" stroke="#D7D0C4" stroke-width="1.5"/>
  <text class="label" x="1044" y="56" font-size="11" text-anchor="middle">REQUIRES CLOUD (03)</text>
  <text class="display" x="64" y="124" font-size="56">Read it in Obsidian</text>
  <text class="deck" x="64" y="168" font-size="19">Notion reads Markdown too — Obsidian’s edge is community plugins, and Remotely Save bridges your cloud.</text>
  <line class="rule" x1="64" y1="204" x2="1136" y2="204"/>

  <!-- ============ column 01 — INSTALL ============ -->
  <text class="display" x="64" y="256" font-size="32">01</text>
  <text class="label" x="112" y="252" font-size="13">INSTALL</text>
  <line class="hair" x1="64" y1="274" x2="318" y2="274"/>

  <rect class="card" x="76" y="310" width="230" height="90" rx="7"/>
  <text class="labelm" x="92" y="334" font-size="9.5">COMMUNITY PLUGINS</text>
  <line class="hair" x1="76" y1="344" x2="306" y2="344"/>
  <text class="menu" x="92" y="376" font-size="12.5">Remotely Save</text>
  <rect x="250" y="362" width="36" height="17" rx="8.5" fill="#F5DE7E" stroke="#D7D0C4" stroke-width="1.5"/>
  <circle cx="277.5" cy="370.5" r="5.5" fill="#17150F"/>
  <rect x="76" y="430" width="230" height="34" rx="17" fill="#FFFDF7" stroke="#D7D0C4" stroke-width="1.5"/>
  <text class="menu" x="191" y="451" font-size="11" text-anchor="middle">Trust author and enable</text>

  <text class="body" x="64" y="594" font-size="16">Cloud on (03)? In Obsidian:</text>
  <text class="body" x="64" y="616" font-size="16">Community plugins → install</text>
  <text class="body" x="64" y="638" font-size="16">and enable Remotely Save.</text>
  <text class="labelm" x="64" y="672" font-size="11">refs: community plugins</text>

  <!-- ============ column 02 — CONFIGURE ============ -->
  <text class="display" x="336" y="256" font-size="32">02</text>
  <text class="label" x="384" y="252" font-size="13">CONFIGURE</text>
  <line class="hair" x1="336" y1="274" x2="590" y2="274"/>

  <rect class="card" x="348" y="310" width="230" height="172" rx="7"/>
  <line class="hair" x1="348" y1="344" x2="578" y2="344"/>
  <line class="hair" x1="348" y1="378" x2="578" y2="378"/>
  <line class="hair" x1="348" y1="412" x2="578" y2="412"/>
  <line class="hair" x1="348" y1="446" x2="578" y2="446"/>
  <text class="menu" x="364" y="333" font-size="11">Type: WebDAV</text>
  <text class="menu" x="364" y="367" font-size="11">Server: app.koofr.net</text>
  <text class="menu" x="364" y="401" font-size="11">User: you@example.com</text>
  <text class="menu" x="364" y="435" font-size="11">Password: ••••••</text>
  <text class="menu" x="364" y="469" font-size="11">Remote folder: /Bookshelf</text>

  <text class="body" x="336" y="594" font-size="16">Choose WebDAV and fill the</text>
  <text class="body" x="336" y="616" font-size="16">form: server, e-mail, app</text>
  <text class="body" x="336" y="638" font-size="16">password, folder /Bookshelf.</text>
  <text class="labelm" x="336" y="672" font-size="11">refs: koofr app password</text>

  <!-- ============ column 03 — PROTECT ============ -->
  <text class="display" x="608" y="256" font-size="32">03</text>
  <text class="label" x="656" y="252" font-size="13">PROTECT</text>
  <line class="hair" x1="608" y1="274" x2="862" y2="274"/>

  <rect class="card" x="620" y="310" width="230" height="170" rx="7"/>
  <line class="hair" x1="620" y1="388" x2="850" y2="388"/>
  <line class="hair" x1="620" y1="424" x2="850" y2="424"/>
  <text class="menu" x="634" y="334" font-size="10">Abort Sync If</text>
  <text class="menu" x="634" y="350" font-size="10">Modification Above</text>
  <text class="menu" x="634" y="366" font-size="10">Percentage</text>
  <rect class="accent" x="794" y="330" width="46" height="36" rx="5"/>
  <text class="menu" x="817" y="354" font-size="17" text-anchor="middle">100</text>
  <text class="menu" x="634" y="412" font-size="11">Ignore list: *.json</text>
  <text class="menu" x="634" y="450" font-size="11">Sync direction: Bidirectional</text>

  <text class="body" x="608" y="594" font-size="16">Set Abort Sync If Modification</text>
  <text class="body" x="608" y="616" font-size="16">Above Percentage to 100: bulk</text>
  <text class="body" x="608" y="638" font-size="16">exports trip the default 50.</text>
  <text class="labelm" x="608" y="672" font-size="11">refs: SYNC-DIRECTION.md</text>

  <!-- ============ column 04 — SYNC ============ -->
  <text class="display" x="880" y="256" font-size="32">04</text>
  <text class="label" x="928" y="252" font-size="13">SYNC</text>
  <line class="hair" x1="880" y1="274" x2="1134" y2="274"/>

  <!-- sync button -->
  <rect x="956" y="310" width="100" height="30" rx="15" fill="#FFFDF7" stroke="#D7D0C4" stroke-width="1.5"/>
  <text class="menu" x="1006" y="330" font-size="11.5" text-anchor="middle">Sync now</text>

  <!-- arrow down -->
  <path d="M1006 346 V364" fill="none" stroke="#D7D0C4" stroke-width="2"/>
  <path class="accent" d="M999 362 L1006 374 L1013 362 Z" stroke="#D7D0C4" stroke-width="1.5"/>

  <!-- index card -->
  <rect class="card" x="892" y="390" width="230" height="142" rx="7"/>
  <text class="labelm" x="906" y="412" font-size="9.5">00 - INDEX.MD</text>
  <line class="hair" x1="892" y1="422" x2="1122" y2="422"/>
  <text class="menu" x="906" y="446" font-size="10.5">Blackwater</text>
  <text class="labelm" x="1108" y="446" font-size="9" text-anchor="end">150</text>
  <line class="hair" x1="906" y1="456" x2="1108" y2="456"/>
  <text class="menu" x="906" y="470" font-size="10.5">The Left Hand of Darkness</text>
  <text class="labelm" x="1108" y="470" font-size="9" text-anchor="end">89</text>
  <line class="hair" x1="906" y1="480" x2="1108" y2="480"/>
  <text class="menu" x="906" y="494" font-size="10.5">Piranesi</text>
  <text class="labelm" x="1108" y="494" font-size="9" text-anchor="end">42</text>
  <line class="hair" x1="906" y1="504" x2="1108" y2="504"/>
  <text class="menu" x="906" y="518" font-size="10.5">Slaughterhouse-Five</text>
  <text class="labelm" x="1108" y="518" font-size="9" text-anchor="end">67</text>

  <text class="body" x="880" y="594" font-size="16">Sync. The books land in the</text>
  <text class="body" x="880" y="616" font-size="16">vault — 00 - Index.md opens</text>
  <text class="body" x="880" y="638" font-size="16">as a clickable table.</text>
  <text class="labelm" x="880" y="672" font-size="11">refs: readme ▸ obsidian</text>

  <!-- footer -->
  <line class="rule" x1="64" y1="730" x2="1136" y2="730"/>
  <text class="label" x="64" y="758" font-size="12">TOMEDOWN · READ IT IN OBSIDIAN</text>
  <text class="labelm" x="600" y="758" font-size="12" text-anchor="middle">04 / 05</text>
  <text class="labelm" x="1136" y="758" font-size="12" text-anchor="end">2026</text>
</svg>
