<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Tomedown quickstart tutorial 05 — Edit, keep it: write your notes under the heading, flip Preserve manual edits on (off by default) and the export rebuilds only its own block, a hand-edited file is kept as .bak">
  <style>
    .display { font-family: Georgia, "Times New Roman", serif; font-weight: 700; fill: #17150F; }
    .deck    { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #3A362C; }
    .label   { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.8px; fill: #17150F; }
    .labelm  { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.2px; fill: #6B6455; }
    .body    { font-family: Georgia, "Times New Roman", serif; fill: #2B271F; }
    .menu    { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; fill: #17150F; }
    .code    { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #17150F; }
    .rule    { stroke: #17150F; stroke-width: 1; }
    .hair    { stroke: #17150F; stroke-width: 1; opacity: .35; }
    .card    { fill: #FFFDF7; stroke: #17150F; stroke-width: 1.5; }
    .skel    { fill: #D9D2C2; }
    .accent  { fill: #F5C518; }
  </style>

  <!-- paper -->
  <rect width="1200" height="800" fill="#F3EDE1"/>

  <!-- header -->
  <text class="label" x="64" y="56" font-size="13">TOMEDOWN — QUICKSTART</text>
  <text class="labelm" x="1136" y="56" font-size="13" text-anchor="end">KOReader plugin</text>
  <text class="display" x="64" y="124" font-size="56">Edit, keep it</text>
  <text class="deck" x="64" y="168" font-size="19">Write in the file itself — flip one switch and every export leaves your notes alone.</text>
  <line class="rule" x1="64" y1="204" x2="1136" y2="204"/>

  <!-- ============ column 01 — WRITE ============ -->
  <text class="display" x="64" y="256" font-size="32">01</text>
  <text class="label" x="112" y="252" font-size="13">WRITE</text>
  <line class="hair" x1="64" y1="274" x2="408" y2="274"/>

  <!-- the file: your zone above, the generated block below -->
  <rect class="card" x="76" y="296" width="330" height="230" rx="7"/>
  <text class="code" x="92" y="324" font-size="10.5" fill="#6B6455">BLACKWATER.MD</text>
  <line class="hair" x1="76" y1="334" x2="406" y2="334"/>
  <text class="code" x="92" y="358" font-size="10.5">## My notes... &lt;!-- tomedown:notes --&gt;</text>
  <rect class="accent" x="90" y="368" width="4" height="17"/>
  <text class="code" x="106" y="381" font-size="10.5">the ending wrecked me</text>
  <text class="labelm" x="390" y="381" font-size="9" text-anchor="end">YOURS</text>
  <text class="code" x="92" y="406" font-size="10" fill="#6B6455">&lt;!-- tomedown:begin ... --&gt;</text>
  <text class="code" x="92" y="428" font-size="10.5"># **HIGHLIGHTS: 150**</text>
  <text class="labelm" x="390" y="428" font-size="9" text-anchor="end">GENERATED</text>
  <rect class="skel" x="92" y="442" width="264" height="7" rx="3.5"/>
  <rect class="skel" x="92" y="456" width="208" height="7" rx="3.5"/>
  <rect class="skel" x="92" y="470" width="240" height="7" rx="3.5"/>
  <text class="code" x="92" y="500" font-size="10" fill="#6B6455">&lt;!-- tomedown:end body --&gt;</text>

  <text class="body" x="64" y="594" font-size="16">Write under the heading, above the</text>
  <text class="body" x="64" y="616" font-size="16">comment: that zone is yours. Below it,</text>
  <text class="body" x="64" y="638" font-size="16">Tomedown rebuilds the block every time.</text>
  <text class="labelm" x="64" y="672" font-size="11">refs: readme ▸ preserve your edits</text>

  <!-- ============ column 02 — NAME IT ============ -->
  <text class="display" x="448" y="256" font-size="32">02</text>
  <text class="label" x="496" y="252" font-size="13">NAME IT</text>
  <line class="hair" x1="448" y1="274" x2="792" y2="274"/>

  <text class="label" x="620" y="306" font-size="11" text-anchor="middle">SETTINGS ▸ STYLE</text>

  <rect class="card" x="490" y="336" width="260" height="52" rx="7"/>
  <rect class="accent" x="600" y="350" width="96" height="22"/>
  <text class="menu" x="506" y="367" font-size="11.5">Personal notes:</text>
  <text class="menu" x="606" y="367" font-size="11.5">My notes...</text>

  <rect x="490" y="414" width="260" height="34" rx="17" fill="#F3EDE1" stroke="#17150F" stroke-width="1.5"/>
  <text class="deck" x="620" y="436" font-size="13.5" text-anchor="middle">rename it — or leave it empty</text>

  <text class="body" x="448" y="594" font-size="16">The heading is yours: rename it in</text>
  <text class="body" x="448" y="616" font-size="16">Settings ▸ Style, or leave the setting</text>
  <text class="body" x="448" y="638" font-size="16">empty to export without one.</text>
  <text class="labelm" x="448" y="672" font-size="11">refs: settings ▸ style</text>

  <!-- ============ column 03 — KEEP IT ============ -->
  <text class="display" x="832" y="256" font-size="32">03</text>
  <text class="label" x="880" y="252" font-size="13">KEEP IT</text>
  <line class="hair" x1="832" y1="274" x2="1136" y2="274"/>

  <text class="label" x="1004" y="306" font-size="11" text-anchor="middle">SETTINGS ▸ BEHAVIOUR</text>

  <rect class="card" x="846" y="330" width="290" height="100" rx="7"/>
  <line class="hair" x1="846" y1="380" x2="1136" y2="380"/>
  <text class="menu" x="862" y="362" font-size="11">Auto-export on close</text>
  <rect x="1084" y="347" width="36" height="17" rx="8.5" fill="#FFFDF7" stroke="#17150F" stroke-width="1.5"/>
  <circle cx="1092.5" cy="355.5" r="5.5" fill="#6B6455"/>
  <text class="menu" x="862" y="412" font-size="11">Preserve manual edits</text>
  <rect x="1084" y="397" width="36" height="17" rx="8.5" fill="#F5C518" stroke="#17150F" stroke-width="1.5"/>
  <circle cx="1111.5" cy="405.5" r="5.5" fill="#17150F"/>

  <!-- export arrow -->
  <path d="M1004 438 V454" fill="none" stroke="#17150F" stroke-width="2"/>
  <path class="accent" d="M997 452 L1004 464 L1011 452 Z" stroke="#17150F" stroke-width="1.5"/>

  <rect x="870" y="478" width="268" height="34" rx="17" fill="#F3EDE1" stroke="#17150F" stroke-width="1.5"/>
  <text class="deck" x="1004" y="500" font-size="13.5" text-anchor="middle">“3 files backed up (.bak)”</text>

  <text class="body" x="832" y="594" font-size="16">Switch it on (off by default): your</text>
  <text class="body" x="832" y="616" font-size="16">text survives every export, and a hand</text>
  <text class="body" x="832" y="638" font-size="16">edit inside the block goes to .bak first.</text>
  <text class="labelm" x="832" y="672" font-size="11">refs: settings ▸ behaviour</text>

  <!-- footer -->
  <line class="rule" x1="64" y1="730" x2="1136" y2="730"/>
  <text class="label" x="64" y="758" font-size="12">TOMEDOWN · EDIT, KEEP IT</text>
  <text class="labelm" x="600" y="758" font-size="12" text-anchor="middle">05 / 05</text>
  <text class="labelm" x="1136" y="758" font-size="12" text-anchor="end">2026</text>
</svg>
