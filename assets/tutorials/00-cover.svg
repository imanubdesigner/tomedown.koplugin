<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1160" viewBox="0 0 1200 800" role="img" aria-label="Tomedown quickstart cover — five sheets from the first highlight to a note you can edit">
  <style>
    .display { font-family: Georgia, "Times New Roman", serif; font-weight: 700; fill: #37352F; }
    .deck    { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #5C5B57; }
    .label   { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.8px; fill: #37352F; }
    .labelm  { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.2px; fill: #9B9A97; }
    .body    { font-family: Georgia, "Times New Roman", serif; fill: #37352F; }
    .code    { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #37352F; }
    .rule    { stroke: #E3E1DD; stroke-width: 1; }
    .hair    { stroke: #E3E1DD; stroke-width: 1; opacity: 1; }
    .card    { fill: #FFFFFF; stroke: #E3E1DD; stroke-width: 1.5; }
    .frame   { fill: #FFFFFF; stroke: #E3E1DD; stroke-width: 1.5; }
    .skel    { fill: #E3E1DD; }
    .accent  { fill: #F5DE7E; }
  </style>

  <!-- paper -->
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- header -->
  <text class="label" x="64" y="56" font-size="13">TOMEDOWN — QUICKSTART</text>
  <text class="labelm" x="1136" y="56" font-size="13" text-anchor="end">KOReader plugin</text>
  <text class="display" x="64" y="124" font-size="56">From highlight to note</text>
  <text class="deck" x="64" y="168" font-size="19">Mark it, export it, sync it, read it, edit it — and your own edits survive every export.</text>
  <line class="rule" x1="64" y1="204" x2="1136" y2="204"/>

  <!-- ============ the five sheets ============ -->
  <!-- 01 MARK -->
  <rect class="card" x="64" y="240" width="196" height="280" rx="7"/>
  <text class="display" x="80" y="282" font-size="30">01</text>
  <text class="label" x="120" y="279" font-size="12">MARK</text>
  <line class="hair" x1="80" y1="300" x2="244" y2="300"/>
  <rect class="frame" x="92" y="326" width="140" height="96" rx="10"/>
  <rect class="skel" x="110" y="344" width="100" height="6" rx="3"/>
  <rect class="skel" x="110" y="358" width="92" height="6" rx="3"/>
  <rect class="accent" x="110" y="372" width="80" height="10" rx="2"/>
  <circle cx="110" cy="382" r="3.5" fill="#FFFFFF" stroke="#E3E1DD" stroke-width="1.5"/>
  <circle cx="190" cy="382" r="3.5" fill="#FFFFFF" stroke="#E3E1DD" stroke-width="1.5"/>
  <rect class="skel" x="110" y="392" width="96" height="6" rx="3"/>
  <rect class="skel" x="110" y="406" width="70" height="6" rx="3"/>
  <text class="body" x="80" y="466" font-size="13">Long-press the passage;</text>
  <text class="body" x="80" y="486" font-size="13">flag it as special.</text>

  <!-- 02 EXPORT -->
  <rect class="card" x="283" y="240" width="196" height="280" rx="7"/>
  <text class="display" x="299" y="282" font-size="30">02</text>
  <text class="label" x="339" y="279" font-size="12">EXPORT</text>
  <line class="hair" x1="299" y1="300" x2="463" y2="300"/>
  <rect class="card" x="311" y="326" width="140" height="96" rx="7"/>
  <text class="label" x="323" y="340" font-size="7.5">BLACKWATER.MD</text>
  <line class="hair" x1="311" y1="348" x2="451" y2="348"/>
  <rect class="skel" x="323" y="358" width="96" height="5" rx="2.5"/>
  <rect class="skel" x="323" y="370" width="74" height="5" rx="2.5"/>
  <rect class="accent" x="323" y="388" width="116" height="18" rx="9" stroke="#E3E1DD" stroke-width="1"/>
  <text class="code" x="381" y="401" font-size="8" text-anchor="middle">/clipboard/tomedown</text>
  <text class="body" x="299" y="466" font-size="13">Close the book — the .md</text>
  <text class="body" x="299" y="486" font-size="13">is already in the folder.</text>

  <!-- 03 CLOUD -->
  <rect class="card" x="502" y="240" width="196" height="280" rx="7"/>
  <text class="display" x="518" y="282" font-size="30">03</text>
  <text class="label" x="558" y="279" font-size="12">CLOUD</text>
  <line class="hair" x1="518" y1="300" x2="682" y2="300"/>
  <circle cx="578" cy="350" r="24" fill="#91A3B0"/>
  <circle cx="608" cy="342" r="18" fill="#91A3B0"/>
  <circle cx="632" cy="354" r="14" fill="#91A3B0"/>
  <rect x="576" y="356" width="68" height="20" rx="10" fill="#91A3B0"/>
  <path d="M600 384 L600 406" fill="none" stroke="#E3E1DD" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M594 400 L600 408 L606 400" fill="none" stroke="#E3E1DD" stroke-width="2"/>
  <rect class="card" x="574" y="412" width="52" height="24" rx="4"/>
  <rect class="skel" x="582" y="422" width="30" height="4" rx="2"/>
  <rect class="skel" x="582" y="430" width="22" height="4" rx="2"/>
  <text class="body" x="518" y="466" font-size="13">Optional: every export</text>
  <text class="body" x="518" y="486" font-size="13">can upload itself.</text>

  <!-- 04 READ -->
  <rect class="card" x="721" y="240" width="196" height="280" rx="7"/>
  <text class="display" x="737" y="282" font-size="30">04</text>
  <text class="label" x="777" y="279" font-size="12">READ</text>
  <line class="hair" x1="737" y1="300" x2="901" y2="300"/>
  <rect class="card" x="737" y="330" width="60" height="76" rx="5"/>
  <text class="label" x="743" y="344" font-size="6.5">00 - INDEX</text>
  <rect class="skel" x="743" y="354" width="40" height="4" rx="2"/>
  <rect class="skel" x="743" y="364" width="34" height="4" rx="2"/>
  <rect class="skel" x="743" y="374" width="38" height="4" rx="2"/>
  <rect class="skel" x="743" y="384" width="30" height="4" rx="2"/>
  <path d="M803 368 L829 368" fill="none" stroke="#E3E1DD" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M823 363 L831 368 L823 373" fill="none" stroke="#E3E1DD" stroke-width="2"/>
  <rect class="card" x="837" y="330" width="64" height="76" rx="5"/>
  <text class="label" x="843" y="344" font-size="6.5">BLACKWATER</text>
  <line class="hair" x1="837" y1="348" x2="901" y2="348"/>
  <rect class="accent" x="843" y="356" width="44" height="7" rx="1.5"/>
  <rect class="skel" x="843" y="372" width="48" height="4" rx="2"/>
  <rect class="skel" x="843" y="382" width="40" height="4" rx="2"/>
  <text class="body" x="737" y="466" font-size="13">One index, one file —</text>
  <text class="body" x="737" y="486" font-size="13">any Markdown app reads it.</text>

  <!-- 05 KEEP -->
  <rect class="card" x="940" y="240" width="196" height="280" rx="7"/>
  <text class="display" x="956" y="282" font-size="30">05</text>
  <text class="label" x="996" y="279" font-size="12">KEEP</text>
  <line class="hair" x1="956" y1="300" x2="1120" y2="300"/>
  <rect class="accent" x="997" y="330" width="84" height="22" rx="11" stroke="#E3E1DD" stroke-width="1"/>
  <text class="label" x="1039" y="345" font-size="10" text-anchor="middle">YOURS</text>
  <rect x="983" y="360" width="110" height="22" rx="11" fill="#F5F5F4" stroke="#E3E1DD" stroke-width="1"/>
  <text class="label" x="1038" y="375" font-size="10" text-anchor="middle" fill="#9B9A97">GENERATED</text>
  <rect x="1002" y="398" width="44" height="24" rx="12" fill="#FFFFFF" stroke="#E3E1DD" stroke-width="1.5"/>
  <circle cx="1014" cy="410" r="8" fill="#9B9A97"/>
  <text class="labelm" x="1056" y="414" font-size="9">OFF</text>
  <text class="body" x="956" y="466" font-size="13">Write your notes; the</text>
  <text class="body" x="956" y="486" font-size="13">original stays as .bak.</text>

  <!-- statement -->
  <text class="deck" x="64" y="586" font-size="24">“No code, five minutes — each sheet stands alone.”</text>
  <text class="body" x="64" y="620" font-size="16">Read them in order, or jump straight to the sheet you need.</text>

  <!-- CTA -->
  <rect class="accent" x="906" y="556" width="230" height="48" rx="24" stroke="#E3E1DD" stroke-width="1.5"/>
  <text class="label" x="1021" y="586" font-size="13" text-anchor="middle">START WITH SHEET 01</text>

  <!-- footer -->
  <line class="rule" x1="64" y1="730" x2="1136" y2="730"/>
  <text class="label" x="64" y="758" font-size="12">TOMEDOWN · THE QUICKSTART</text>
  <text class="labelm" x="600" y="758" font-size="12" text-anchor="middle">COVER · 00 / 05</text>
  <text class="labelm" x="1136" y="758" font-size="12" text-anchor="end">2026</text>
</svg>
