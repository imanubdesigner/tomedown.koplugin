  <path d="M64 260 Q64 250 74 250 H824 Q834 250 834 260 V288 H64 Z" fill="#F5F5F4"/>
  <line class="hair" x1="64" y1="288" x2="834" y2="288"/>
  <text class="code" x="88" y="274" font-size="12.5">00 - Index.md</text>
  <text class="comment" x="812" y="274" font-size="13" text-anchor="middle">×</text>
