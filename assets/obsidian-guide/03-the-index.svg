  <text class="comment" x="128" y="946" font-size="8.5">&lt;!-- tomedown:end index --&gt;</text>

  <!-- ============ notes column: every arrow touches its target ============ -->
  <text class="labelm" x="866" y="296" font-size="11">YOUR HEADING</text>
  <text class="body" x="866" y="322" font-size="15">Same heading as the books;</text>
  <text class="body" x="866" y="344" font-size="15">rename it in Settings ▸ Style</text>
  <text class="body" x="866" y="366" font-size="15">— the gray tag after it stays,</text>
  <text class="body" x="866" y="388" font-size="15">that's the line it rewrites.</text>
  <path class="dash" marker-end="url(#ah)" d="M864 396 H420 V460 H331"/>

  <text class="labelm" x="866" y="440" font-size="11">YOUR ZONE</text>
  <text class="body" x="866" y="466" font-size="15">Heading, two blank lines and</text>
  <text class="body" x="866" y="488" font-size="15">your words above the marker:</text>
  <text class="body" x="866" y="510" font-size="15">same rules as the books.</text>
  <path class="dash" marker-end="url(#ah)" d="M864 518 H812 V487 H773"/>

  <text class="labelm" x="866" y="560" font-size="11">THE STATS LINE</text>
  <text class="body" x="866" y="586" font-size="15">Books, highlights and the</text>
  <text class="body" x="866" y="608" font-size="15">starred specials — one bold</text>
  <text class="body" x="866" y="630" font-size="15">line, star out front.</text>
  <path class="dash" marker-end="url(#ah)" d="M864 640 H400"/>

  <text class="labelm" x="866" y="690" font-size="11">THE LINKS</text>
  <text class="body" x="866" y="716" font-size="15">Every title is a wiki link;</text>
  <text class="body" x="866" y="738" font-size="15">Status keeps the word over</text>
  <text class="body" x="866" y="760" font-size="15">the bar, the percent stuck</text>
  <text class="body" x="866" y="782" font-size="15">to it; the date gets a column.</text>
  <path class="dash" marker-end="url(#ah)" d="M864 748 H794"/>

  <!-- the switch -->
  <rect class="card" x="866" y="830" width="270" height="180" rx="10" fill="#FBFBFA"/>
  <text class="label" x="884" y="862" font-size="11">SETTINGS ▸ MARKDOWN</text>
  <rect x="884" y="878" width="44" height="22" rx="11" fill="#7F6DF2"/>
  <circle cx="917" cy="889" r="8" fill="#FFFFFF"/>
  <text class="menu" x="940" y="886" font-size="12.5">Generate the</text>
  <text class="menu" x="940" y="902" font-size="12.5">00 - Index.md</text>
  <text class="labelm" x="884" y="930" font-size="10">ON BY DEFAULT</text>
  <text class="body" x="884" y="962" font-size="13.5">Tick it — it already is.</text>
  <text class="body" x="884" y="982" font-size="13.5">The index is written next</text>
  <text class="body" x="884" y="1002" font-size="13.5">to the books, every run.</text>

