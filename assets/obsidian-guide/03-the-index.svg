  <!-- paper -->
  <rect width="1200" height="1697" fill="#FFFFFF"/>

  <!-- header -->
  <text class="label" x="64" y="56" font-size="13">TOMEDOWN — OBSIDIAN GUIDE</text>
  <text class="labelm" x="1136" y="56" font-size="13" text-anchor="end">KOReader plugin</text>
  <text class="display" x="64" y="124" font-size="56">The index</text>
  <text class="deck" x="64" y="168" font-size="19">One file for the whole library — rebuilt on every export, with its own write zone and its own switch.</text>
  <line class="rule" x1="64" y1="204" x2="1136" y2="204"/>

