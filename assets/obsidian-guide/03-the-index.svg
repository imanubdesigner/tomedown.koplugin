  <rect class="note" x="916" y="272" width="220" height="136" rx="10"/>
  <text class="nhead" x="934" y="302" font-size="11">YOUR HEADING</text>
  <text class="body" x="934" y="326" font-size="14.5">Same heading as the books;</text>
  <text class="body" x="934" y="346" font-size="14.5">rename it in Settings ▸</text>
  <text class="body" x="934" y="366" font-size="14.5">— the gray tag that marks</text>
  <text class="body" x="934" y="386" font-size="14.5">the line it rewrites.</text>
  <path class="dash" marker-end="url(#ah)" d="M904 340 C720 340 628 462 434 462"/>

  <rect class="note" x="916" y="432" width="220" height="116" rx="10"/>
  <text class="nhead" x="934" y="462" font-size="11">YOUR ZONE</text>
  <text class="body" x="934" y="486" font-size="14.5">Heading, two blank lines</text>
  <text class="body" x="934" y="506" font-size="14.5">and your words above the</text>
  <text class="body" x="934" y="526" font-size="14.5">marker: the book's rules.</text>
  <path class="dash" marker-end="url(#ah)" d="M904 490 C712 490 616 530 423 530"/>

  <rect class="note" x="916" y="572" width="220" height="116" rx="10"/>
  <text class="nhead" x="934" y="602" font-size="11">THE STATS LINE</text>
  <text class="body" x="934" y="626" font-size="14.5">Books, highlights and the</text>
  <text class="body" x="934" y="646" font-size="14.5">starred specials — one</text>
  <text class="body" x="934" y="666" font-size="14.5">bold line, star in front.</text>
  <path class="dash" marker-end="url(#ah)" d="M904 630 C751 630 674 648 507 648"/>

  <rect class="note" x="916" y="712" width="220" height="96" rx="10"/>
  <text class="nhead" x="934" y="742" font-size="11">THE LINKS</text>
  <text class="body" x="934" y="766" font-size="14.5">Every title is a wiki link;</text>
  <text class="body" x="934" y="786" font-size="14.5">status and date in columns.</text>
 <path class="dash" marker-end="url(#ah)" d="M904 775 C894 775 876 803 679 795"/> 

