  <!-- frontmatter -->
  <text class="struct" x="128" y="312" font-size="10.5">---</text>
  <text class="code" x="128" y="330" font-size="10.5">tomedown: "1.0"</text>
  <text class="code" x="128" y="348" font-size="10.5">title: "Book index"</text>
  <text class="code" x="128" y="366" font-size="10.5">exported: "2026-10-07"</text>
  <text class="code" x="128" y="384" font-size="10.5">tags:</text>
  <text class="code" x="128" y="402" font-size="10.5">  - ebook</text>
  <text class="code" x="128" y="420" font-size="10.5">  - index</text>
  <text class="struct" x="128" y="438" font-size="10.5">---</text>

  <!-- your write zone: heading, room, your words -->
  <text x="128" y="462" font-size="12" font-family="SF Mono, Menlo, Consolas, JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" fill="#37352F">## My notes... <tspan font-size="10" fill="#9B9A97">&lt;!-- tomedown:notes --&gt;</tspan></text>
  <rect class="dash" x="128" y="476" width="420" height="30" rx="4"/>
  <rect class="accent" x="120" y="520" width="4" height="16"/>
  <text class="code" x="134" y="530" font-size="10.5">The slow-burn one — started in the tent.</text>

  <!-- the marker and the generated block -->
  <text class="comment" x="128" y="570" font-size="10.5">&lt;!-- tomedown:begin index hash=2a50b55d — generated below: do not edit inside … write your notes above --&gt;</text>
  <text class="struct" x="128" y="606" font-size="9.5">---</text>
  <text class="struct" x="128" y="648" font-size="11">**14 books** · **89 highlights** · **★ 16 special**</text>
