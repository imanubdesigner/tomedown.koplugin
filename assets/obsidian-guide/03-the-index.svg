  <!-- source lines -->
  <text class="code" x="128" y="316" font-size="8.5">---</text>
  <text class="code" x="128" y="334" font-size="8.5">tomedown: "1.0"</text>
  <text class="code" x="128" y="352" font-size="8.5">title: "Book index"</text>
  <text class="code" x="128" y="370" font-size="8.5">exported: "2026-10-07"</text>
  <text class="code" x="128" y="388" font-size="8.5">tags:</text>
  <text class="code" x="128" y="406" font-size="8.5">  - ebook</text>
  <text class="code" x="128" y="424" font-size="8.5">  - index</text>
  <text class="code" x="128" y="442" font-size="8.5">---</text>
  <text x="128" y="460" font-size="8.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#37352F">## My notes... <tspan fill="#9B9A97">&lt;!-- tomedown:notes --&gt;</tspan></text>
  <rect class="dash" x="120" y="474" width="640" height="26" rx="4"/>
  <rect class="accent" x="120" y="521" width="4" height="15"/>
  <text class="code" x="134" y="532" font-size="8.5">The slow-burn one — started in the tent.</text>
    <text class="code" x="128" y="550" font-size="8.5"> </text>
  <text class="comment" x="128" y="568" font-size="7.5">&lt;!-- tomedown:begin index hash=2a50b55d — ⛔ generated below: do not edit inside … write your notes above --&gt;</text>
  <text class="code" x="128" y="586" font-size="8.5"> </text>
  <text class="code" x="128" y="604" font-size="8.5">---</text>
  <text class="code" x="128" y="622" font-size="8.5"> </text>
  <text class="code" x="128" y="640" font-size="8.5">**14 books** · **89 highlights** · **★ 16 special**</text>
  <text class="code" x="128" y="658" font-size="8.5"> </text>
  <text class="code" x="128" y="676" font-size="8.5">### Series books</text>
  <text class="code" x="128" y="694" font-size="8.5"> </text>
  <text class="code" x="128" y="712" font-size="8.5">| Book | Author | Series | Status | Last read | Highlights |</text>
