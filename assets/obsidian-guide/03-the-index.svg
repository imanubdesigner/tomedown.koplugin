<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1697" viewBox="0 0 1200 1697" role="img" aria-label="Tomedown Obsidian guide 03 — the index: one 00 - Index.md for the whole library with the stats line, two tables of wiki links, its own write zone above the marker, the settings toggle that generates it, and how it looks in reading view">
  <style>
    .display { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Times New Roman", "Liberation Serif", "DejaVu Serif", serif; font-weight: 700; fill: #37352F; }
